name: Heikin Ashi 4H Flip Alert

on:
  schedule:
    # Runs 5 minutes after each 4H candle close (00:00, 04:00, 08:00,
    # 12:00, 16:00, 20:00 UTC), giving Binance a moment to finalize the candle.
  - cron: "*/5 * * * *"  # Lets you manually trigger a run from the GitHub Actions tab to test it.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-flip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Heikin Ashi check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ha_alert.py

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          git diff --quiet --cached || git commit -m "Update HA state [skip ci]"
          git push
